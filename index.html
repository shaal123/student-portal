<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Portal</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="portal">
    <header class="topbar">Student Portal</header>
    <section class="content">
      <form id="searchForm" class="search-row">
        <label class="sr-only" for="searchInput">Search students</label>
        <input id="searchInput" type="search" placeholder="Search by first name, last name, or email" autocomplete="off" />
        <button type="submit" class="search-button">Search</button>
      </form>

      <nav class="sort-buttons" aria-label="Student sorting options">
        <button type="button" data-action="az">Sort A→Z</button>
        <button type="button" data-action="za">Sort Z→A</button>
        <button type="button" data-action="marks">Sort By Marks</button>
        <button type="button" data-action="passing">Sort By Passing</button>
        <button type="button" data-action="class">Sort By Class</button>
        <button type="button" data-action="gender">Sort By Gender</button>
      </nav>

      <p id="status" class="status" role="status">Loading student data…</p>
      <div id="tables" class="tables"></div>
    </section>
  </main>
</body>
</html>
